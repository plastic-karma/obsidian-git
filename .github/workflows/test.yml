name: test
on:
    push:
    pull_request:
jobs:
    svelte-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - name: Install modules
              run: pnpm install --frozen-lockfile
            - name: Run Svelte-Check
              run: pnpm run svelte
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - name: Install modules
              run: pnpm install --frozen-lockfile
            - name: Run ESLint
              run: pnpm run lint
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - name: Install modules
              run: pnpm install --frozen-lockfile
            - name: Run Prettier
              run: pnpm run format
    compile:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - name: Install modules
              run: pnpm install --frozen-lockfile
            - name: Run tsc
              run: pnpm run tsc --noEmit
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - name: Install modules
              run: pnpm install --frozen-lockfile
            - name: Run build
              run: pnpm run test
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - name: Install modules
              run: pnpm install --frozen-lockfile
            - name: Run build
              run: pnpm run build
